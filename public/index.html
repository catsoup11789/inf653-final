<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>US States Explorer</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: 'Segoe UI', Arial, sans-serif;
			min-height: 100vh;
			background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #1565c0 100%);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}
		.card {
			background: white;
			border-radius: 20px;
			box-shadow: 0 20px 60px rgba(0,0,0,0.3);
			max-width: 560px;
			width: 100%;
			overflow: hidden;
		}
		.card-header {
			background: linear-gradient(135deg, #b71c1c, #c62828);
			padding: 30px;
			text-align: center;
			color: white;
			position: relative;
		}
		.flag-emoji { font-size: 3rem; display: block; margin-bottom: 8px; }
		.state-name {
			font-size: 2rem;
			font-weight: 700;
			letter-spacing: 1px;
		}
		.state-abbr {
			font-size: 1rem;
			opacity: 0.8;
			margin-top: 4px;
		}
		.card-body { padding: 28px; }
		#content { min-height: 260px; }
		.info-grid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 16px;
			margin-bottom: 20px;
		}
		.info-item {
			background: #f5f7ff;
			border-radius: 12px;
			padding: 14px 16px;
		}
		.info-label {
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 1px;
			color: #888;
			margin-bottom: 4px;
		}
		.info-value {
			font-size: 1.05rem;
			font-weight: 600;
			color: #1a237e;
		}
		.funfact-box {
			background: #fff8e1;
			border-left: 4px solid #ffc107;
			border-radius: 8px;
			padding: 16px;
			margin-bottom: 20px;
			font-size: 0.95rem;
			color: #555;
			line-height: 1.5;
			min-height: 56px;
		}
		.funfact-label {
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 1px;
			color: #bbb;
			margin-bottom: 6px;
		}
		.btn {
			display: block;
			width: 100%;
			padding: 14px;
			background: linear-gradient(135deg, #1a237e, #1565c0);
			color: white;
			border: none;
			border-radius: 12px;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: opacity 0.2s, transform 0.1s;
		}
		.btn:hover { opacity: 0.9; transform: translateY(-1px); }
		.btn:active { transform: translateY(0); }
		.btn:disabled { opacity: 0.5; cursor: not-allowed; }
		.loading {
			text-align: center;
			color: #aaa;
			padding: 20px 0;
			font-size: 0.95rem;
		}
		.spinner {
			display: inline-block;
			width: 28px;
			height: 28px;
			border: 3px solid #e0e0e0;
			border-top-color: #1a237e;
			border-radius: 50%;
			animation: spin 0.7s linear infinite;
			margin-bottom: 8px;
		}
		@keyframes spin { to { transform: rotate(360deg); } }
		.error { color: #c62828; text-align: center; padding: 12px 0; font-size: 0.93rem; }
	</style>
</head>
<body>
<div class="card">
	<div class="card-header">
		<span class="flag-emoji">🇺🇸</span>
		<div class="state-name" id="state-name">US States Explorer</div>
		<div class="state-abbr" id="state-abbr">Click below to discover a random state</div>
	</div>
	<div class="card-body">
		<div id="content">
			<div class="loading">Press the button to load a random state!</div>
		</div>
		<button class="btn" id="random-btn" onclick="loadRandomState()">🎲 Random State</button>
		<a href="/api.html" style="display:block;text-align:center;margin-top:14px;font-size:0.85rem;color:#888;text-decoration:none;">📄 View API Documentation</a>
	</div>
</div>

<script>
	window.addEventListener('DOMContentLoaded', loadRandomState);
	const BASE = 'https://inf653-final.catsoup.dev/states';
	const STATES = [
		'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA',
		'HI','ID','IL','IN','IA','KS','KY','LA','ME','MD',
		'MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
		'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC',
		'SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'
	];

	async function loadRandomState() {
		const btn = document.getElementById('random-btn');
		btn.disabled = true;
		showLoading();

		const code = STATES[Math.floor(Math.random() * STATES.length)];

		try {
			const [stateRes, factRes] = await Promise.all([
				fetch(`${BASE}/${code}`),
				fetch(`${BASE}/${code}/funfact`)
			]);

			const state = await stateRes.json();
			let funfact = '';
			if (factRes.ok) {
				const factData = await factRes.json();
				funfact = factData.funfact || '';
			}

			document.getElementById('state-name').textContent = state.state || code;
			document.getElementById('state-abbr').textContent = state.code || code;

			renderState(state, funfact);
		} catch (e) {
			document.getElementById('content').innerHTML = `<div class="error">Failed to load state data. Please try again.</div>`;
		}

		btn.disabled = false;
	}

	function renderState(s, funfact) {
		const admission = s.admission_date
			? new Date(s.admission_date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
			: (s.admission || 'N/A');

		document.getElementById('content').innerHTML = `
			<div class="info-grid">
				<div class="info-item">
					<div class="info-label">Capital</div>
					<div class="info-value">${s.capital_city || s.capital || 'N/A'}</div>
				</div>
				<div class="info-item">
					<div class="info-label">Nickname</div>
					<div class="info-value">${s.nickname || 'N/A'}</div>
				</div>
				<div class="info-item">
					<div class="info-label">Population</div>
					<div class="info-value">${s.population ? Number(s.population).toLocaleString() : 'N/A'}</div>
				</div>
				<div class="info-item">
					<div class="info-label">Admitted</div>
					<div class="info-value">${admission}</div>
				</div>
			</div>
			<div class="funfact-label">🌟 Fun Fact</div>
			<div class="funfact-box">${funfact || '<em style="color:#bbb">No fun facts on record yet.</em>'}</div>
		`;
	}

	function showLoading() {
		document.getElementById('state-name').textContent = 'Loading...';
		document.getElementById('state-abbr').textContent = '';
		document.getElementById('content').innerHTML = `
			<div class="loading">
				<div class="spinner"></div><br>Fetching state data...
			</div>
		`;
	}
</script>
</body>
</html>
